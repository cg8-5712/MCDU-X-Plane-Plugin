name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: win
            artifact_name: win.xpl
          - os: ubuntu-latest
            platform_name: lin
            artifact_name: lin.xpl
          - os: macos-latest
            platform_name: mac
            artifact_name: mac.xpl

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev

      - name: Cache X-Plane SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: extern/XPLM-SDK
          key: xpsdk-301-${{ runner.os }}

      - name: Download X-Plane SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p extern
          cd extern
          curl -L -o XPSDK.zip https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK301.zip
          unzip -q XPSDK.zip
          mv SDK XPLM-SDK
          rm XPSDK.zip

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DXPLM_SDK_PATH="${{ github.workspace }}/extern/XPLM-SDK"

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp "dist/Release/${{ matrix.artifact_name }}" "artifact/${{ matrix.artifact_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCDU-${{ matrix.platform_name }}
          path: artifact/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/MCDU-win/win.xpl
            artifacts/MCDU-lin/lin.xpl
            artifacts/MCDU-mac/mac.xpl
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
